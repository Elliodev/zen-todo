<main class="min-h-screen bg-slate-950 text-white flex flex-col items-center pt-16 px-6 font-sans selection:bg-white/20">

  <header class="mb-12 text-center">
    <h1 class="text-3xl font-extralight tracking-[0.3em] uppercase opacity-40">Priorités</h1>
    <div class="h-px w-12 bg-white/20 mx-auto mt-4"></div>
  </header>

  <div class="w-full max-w-md">

    <div class="relative group mb-10">
      <input
        type="text"
        [value]="todoText()"
        (input)="todoText.set($any($event.target).value)"
        (keyup.enter)="addTodo()"
        placeholder="Note une intention..."
        class="w-full bg-transparent border-b border-white/10 py-4 pr-12 focus:outline-none focus:border-white/40 transition-all duration-500 placeholder:text-white/10 placeholder:italic text-lg"
      >
      <button
        (click)="addTodo()"
        class="absolute right-0 top-1/2 -translate-y-1/2 p-2 opacity-0 group-focus-within:opacity-100 transition-opacity duration-300 cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>

    <ul class="space-y-3">
      @for (todo of todos(); track todo.id) {
        <li class="group flex items-center gap-4 bg-white/[0.02] border border-white/[0.05] p-4 rounded-2xl hover:bg-white/[0.04] transition-all duration-300">

          <button
            (click)="toggleTodo(todo.id)"
            class="w-6 h-6 rounded-full border border-white/20 flex items-center justify-center transition-all duration-500 hover:border-white/50 cursor-pointer"
            [class.bg-white]="todo.completed"
            [class.border-white]="todo.completed"
          >
            @if (todo.completed) {
              <svg class="w-3 h-3 text-slate-950" fill="none" stroke="currentColor" stroke-width="4" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
            }
          </button>

          <span
            class="flex-1 text-sm font-light tracking-wide transition-all duration-500"
            [class.line-through]="todo.completed"
            [class.opacity-30]="todo.completed"
          >
            {{ todo.text }}
          </span>

          <button
            (click)="removeTodo(todo.id)"
            class="p-2 opacity-0 group-hover:opacity-40 hover:!opacity-100 transition-opacity duration-200 cursor-pointer"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </li>
      } @empty {
        <div class="text-center py-20 opacity-10 italic font-light tracking-widest">
          Rien de prévu pour l'instant.
        </div>
      }
    </ul>

    @if (todos().length > 0) {
      <footer class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center text-[10px] uppercase tracking-[0.2em] text-white/20">
        <span>{{ remainingCount() }} focus restants</span>
        <span class="opacity-50 italic">Zen Todo</span>
      </footer>
    }

  </div>
</main>
